<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Search</title>
<style>
body{font-family:Arial;background:#07111f;color:white;padding:20px}
.box{background:#122238;padding:20px;border-radius:18px;margin-top:20px}
input{width:100%;box-sizing:border-box;padding:15px;border:0;border-radius:12px;font-size:16px}
.item{background:#1b304a;padding:15px;margin:10px 0;border-radius:12px}
a{color:#93c5fd}
</style>
<link rel="stylesheet" href="style.css">
</head>
<body>

<a href="index.html">← Home</a>

<div class="box">
<h1>🔎 Study Search</h1>
<input id="search" placeholder="Topic search karo...">

<div id="results">
<div class="item">Physical Pharmacy</div>
<div class="item">States of Matter</div>
<div class="item">Solubility</div>
<div class="item">Dissolution</div>
<div class="item">pH & Buffers</div>
<div class="item">Electrolytes</div>
<div class="item">Carbohydrates</div>
<div class="item">Krebs Cycle</div>
<div class="item">Cell Membrane</div>
<div class="item">Enzymes</div>
</div>
</div>

<script>
let items=document.querySelectorAll(".item");
document.getElementById("search").oninput=function(){
let q=this.value.toLowerCase();
items.forEach(x=>{
x.style.display=x.innerText.toLowerCase().includes(q)?"block":"none";
});
};
</script>

</body>
</html>
